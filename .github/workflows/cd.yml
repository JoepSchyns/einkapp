name: CD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository_owner }}

jobs:
  release:
    name: Build, Push & Release
    runs-on: ubuntu-latest
    permissions:
      contents: write      # create GitHub releases
      packages: write      # push to ghcr.io

    outputs:
      version: ${{ steps.version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Generate version
        id: version
        run: |
          VERSION="v$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push api
        uses: docker/build-push-action@v6
        with:
          context: ./api
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/einkapp-api:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/einkapp-api:latest
          cache-from: type=gha,scope=api
          cache-to: type=gha,mode=max,scope=api

      - name: Build and push screenshot-service
        uses: docker/build-push-action@v6
        with:
          context: ./screenshot-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/einkapp-screenshot-service:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/einkapp-screenshot-service:latest
          cache-from: type=gha,scope=screenshot-service
          cache-to: type=gha,mode=max,scope=screenshot-service

      - name: Build and push ble-service
        uses: docker/build-push-action@v6
        with:
          context: ./ble-service
          push: true
          tags: |
            ${{ env.IMAGE_PREFIX }}/einkapp-ble-service:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/einkapp-ble-service:latest
          cache-from: type=gha,scope=ble-service
          cache-to: type=gha,mode=max,scope=ble-service

      - name: Build and push frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          push: true
          build-args: |
            PUBLIC_SITE_URL=${{ secrets.PUBLIC_SITE_URL }}
          tags: |
            ${{ env.IMAGE_PREFIX }}/einkapp-frontend:${{ steps.version.outputs.version }}
            ${{ env.IMAGE_PREFIX }}/einkapp-frontend:latest
          cache-from: type=gha,scope=frontend
          cache-to: type=gha,mode=max,scope=frontend

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.version }}
          name: ${{ steps.version.outputs.version }}
          generate_release_notes: true
          make_latest: true

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: release
    environment: production
    permissions:
      packages: read   # allows passing GITHUB_TOKEN to pull private ghcr.io images

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # With command= in authorized_keys the server ignores this script and runs
          # deploy.sh instead, but SSH_ORIGINAL_COMMAND is set to this string so the
          # deploy script can parse the token and actor from it.
          script: "GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }} GITHUB_ACTOR=${{ github.actor }}"
