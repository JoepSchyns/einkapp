name: CD

on:
  push:
    branches:
      - main

env:
  REGISTRY: ghcr.io

jobs:
  prepare:
    name: Prepare version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      image_prefix: ${{ steps.version.outputs.image_prefix }}
    steps:
      - uses: actions/checkout@v4
      - name: Generate version
        id: version
        run: |
          VERSION="v$(date -u +%Y.%m.%d)-$(git rev-parse --short HEAD)"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Version: $VERSION"
          IMAGE_PREFIX="ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "image_prefix=$IMAGE_PREFIX" >> "$GITHUB_OUTPUT"
          echo "Image prefix: $IMAGE_PREFIX"

  build:
    name: Build & push ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      packages: write
    strategy:
      matrix:
        include:
          - service: api
            context: ./api
          - service: screenshot-service
            context: ./screenshot-service
          - service: ble-service
            context: ./ble-service
          - service: frontend
            context: ./frontend

    steps:
      - uses: actions/checkout@v4

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push ${{ matrix.service }}
        uses: docker/build-push-action@v6
        with:
          context: ${{ matrix.context }}
          push: true
          build-args: ${{ matrix.service == 'frontend' && format('PUBLIC_SITE_URL={0}', secrets.PUBLIC_SITE_URL) || '' }}
          tags: |
            ${{ needs.prepare.outputs.image_prefix }}/einkapp-${{ matrix.service }}:${{ needs.prepare.outputs.version }}
            ${{ needs.prepare.outputs.image_prefix }}/einkapp-${{ matrix.service }}:latest
          cache-from: type=gha,scope=${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=${{ matrix.service }}

  github-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [prepare, build]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.version }}
          name: ${{ needs.prepare.outputs.version }}
          generate_release_notes: true
          make_latest: true

  deploy:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [prepare, github-release]
    environment: production
    permissions:
      packages: read   # allows passing GITHUB_TOKEN to pull private ghcr.io images

    steps:
      - name: SSH deploy
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          # With command= in authorized_keys the server ignores this script and runs
          # deploy.sh instead, but SSH_ORIGINAL_COMMAND is set to this string so the
          # deploy script can parse the token and actor from it.
          script: "GHCR_TOKEN=${{ secrets.GITHUB_TOKEN }} GITHUB_ACTOR=${{ github.actor }}"
