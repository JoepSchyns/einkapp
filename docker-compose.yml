services:
  api:
    build: ./api
    expose:
      - "${API_PORT}"
    environment:
      - API_PORT
      # Image generators
      - REDDIT_CLIENT_ID
      - REDDIT_CLIENT_SECRET
      - UNSPLASH_ACCESS_KEY
      # Admin
      - ADMIN_USERNAME
      - ADMIN_PASSWORD
      - JWT_SECRET
      # Internal service URLs
      - BLE_SERVICE_URL
      - BLE_SERVICE_PORT
      - SCREENSHOT_SERVICE_URL
      - SCREENSHOT_SERVICE_PORT
      - FRONTEND_URL
    volumes:
      - ./data/api:/app/data
    depends_on:
      - ble-service
      - screenshot-service

  screenshot-service:
    build: ./screenshot-service
    expose:
      - "${SCREENSHOT_SERVICE_PORT}"
    environment:
      - PORT=${SCREENSHOT_SERVICE_PORT}

  ble-service:
    build: ./ble-service
    expose:
      - "${BLE_SERVICE_PORT}"
    environment:
      - PORT=${BLE_SERVICE_PORT}
    # Bluetooth access on Linux requires D-Bus and elevated privileges.
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus

  frontend:
    build:
      context: ./frontend
      args:
        - PUBLIC_SITE_URL
    ports:
      - "${FRONTEND_PORT}:80"
    depends_on:
      - api
