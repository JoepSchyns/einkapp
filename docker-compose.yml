services:
  api:
    build: ./api
    expose:
      - "3000"
    environment:
      - REDDIT_CLIENT_ID
      - REDDIT_CLIENT_SECRET
      - UNSPLASH_ACCESS_KEY
      - ADMIN_USERNAME
      - ADMIN_PASSWORD
      - JWT_SECRET
    volumes:
      - ./data/api:/app/data
    depends_on:
      - ble-service

  ble-service:
    build: ./ble-service
    expose:
      - "8000"
    # Bluetooth access on Linux requires D-Bus and elevated privileges.
    privileged: true
    volumes:
      - /var/run/dbus:/var/run/dbus

  frontend:
    build: ./frontend
    ports:
      - "3003:80"
    depends_on:
      - api
