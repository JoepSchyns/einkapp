[project]
name = "ble-service"
version = "0.1.0"
description = "BLE display push service using py-opendisplay"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "py-opendisplay>=7.9.0",
    "pillow>=10.0",
]

[project.scripts]
dev = "main:_dev"
prod = "main:_prod"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]

[tool.uv]
package = true
